name: Certified ±0.3 % engine and 28-pulse result

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    # Keep the published engine's existing check name while limiting CI to this result.
    strategy:
      fail-fast: false
      matrix:
        engine: [engine_eps3e-3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install the pinned dependencies
        run: python -m pip install -r ${{ matrix.engine }}/requirements.txt
      - name: Build the native extensions
        working-directory: ${{ matrix.engine }}
        run: python build_all_native.py
      - name: Unit tests
        working-directory: ${{ matrix.engine }}
        run: python -B -m unittest discover -s tests
      - name: Relative-coordinate regression tests
        run: python -B -m unittest discover -s tests/engine
      - name: Kernel unchanged
        working-directory: ${{ matrix.engine }}/kernel
        run: sha256sum -c --quiet ../../kernel/KERNEL_SHA256SUMS
      - name: Kernel test files (on a scratch copy; every file must pass)
        run: python -B tools/run_kernel_suites.py ${{ matrix.engine }}

  certified-boxes:
    # Recomputes the initial section, the future certificate, its independent check and Q28 of
    # the ±0.3 % box from its committed records (certify/verify.py), standard library only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests of the certification tools
        run: python -B -m unittest discover -s certify/tests
      - name: Inclusion control tests
        run: python -B -m unittest discover -s controls/tests
      - name: Documentation links and certified-engine freeze
        run: python -B -m unittest discover -s tests/repository
      - name: Verify the published ±0.3 % / 28-pulse result
        run: python -I certify/verify.py --box results/eps3e-3
