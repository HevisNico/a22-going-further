name: Engine tests and certified boxes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install the pinned dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Build the native extensions
        working-directory: engine
        run: python build_all_native.py
      - name: Unit tests
        working-directory: engine
        run: python -B -m unittest discover -s tests
      - name: Kernel unchanged
        working-directory: engine/kernel
        run: sha256sum -c --quiet ../../kernel/KERNEL_SHA256SUMS

  certified-boxes:
    # Recomputes the initial section, the future certificate, its independent check and Q28 of
    # every committed box from its committed records (certify/verify.py), standard library only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every committed box
        run: |
          set -e
          found=0
          for box in results/*/; do
            if [ -f "$box/terminal/all_terminal_exact.json" ]; then
              found=1
              python -I certify/verify.py --box "$box"
            fi
          done
          [ "$found" = 1 ] || echo "No certified box committed yet."
